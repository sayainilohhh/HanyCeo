name: Build APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Bundle library offline
        run: |
          mkdir -p www/vendor
          curl -fsSL https://cdn.tailwindcss.com/3.4.17 -o www/vendor/tailwind.js
          curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js -o www/vendor/html2canvas.min.js
          sed -i 's#https://cdn.tailwindcss.com/3.4.17#vendor/tailwind.js#g' www/index.html
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js#vendor/html2canvas.min.js#g' www/index.html
          sed -i '/fonts.googleapis.com/d;/fonts.gstatic.com/d' www/index.html

      - name: Add Android + icon
        run: |
          npx cap add android
          npx @capacitor/assets generate --android \
            --iconBackgroundColor '#F8F7FC' --iconBackgroundColorDark '#7C3AED' || true
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PioFinance.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PioFinance-apk
          path: PioFinance.apk

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PioFinance.apk
