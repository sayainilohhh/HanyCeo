<script>
/* PioFinance domain: logika murni (tanpa DOM/penyimpanan). Dipakai PWA, APK, dan tes. */
(function(g){
const SCHEMA=3,ID=/^[A-Za-z0-9_-]{1,64}$/,COL=/^#[0-9a-fA-F]{6}$/,DT=/^\d{4}-\d{2}-\d{2}$/,YM=/^\d{4}-\d{2}$/;
const bad=e=>({ok:false,error:e}),isInt=n=>Number.isSafeInteger(n),pos=n=>isInt(n)&&n>0;
const okDate=s=>typeof s==='string'&&DT.test(s)&&!isNaN(Date.parse(s+'T00:00:00'));
const str=(s,m)=>typeof s==='string'?s.slice(0,m):'';
const icon=s=>typeof s==='string'&&s.length>0&&s.length<=16&&!/[<>&"'`]/.test(s);
/* Validasi + normalisasi data dari penyimpanan/backup. Menolak ID, warna, ikon yang bisa menyuntik HTML. */
function sanitize(d){
 if(!d||typeof d!=='object'||!Array.isArray(d.cats)||!Array.isArray(d.tx))return bad('struktur data tidak dikenali');
 const o={version:SCHEMA,settings:{},dreams:[],budgets:[],transfers:[],cats:[],tx:[]},cid=new Set();
 if(d.bgMig)o.bgMig=1;if(d.utMig)o.utMig=1;
 const st=d.settings||{};
 if(['system','light','dark'].includes(st.theme))o.settings.theme=st.theme;
 if(st.ctg&&typeof st.ctg==='object'){const cg={};for(const k of['in','out'])if(Array.isArray(st.ctg[k]))cg[k]=st.ctg[k].filter(x=>typeof x==='string'&&x.trim()).map(x=>x.trim().slice(0,30)).slice(0,40);if(cg.in||cg.out)o.settings.ctg=cg}o.settings.appName=str(st.appName,30);o.settings.nick=str(st.nick,30);
 for(const c of d.cats){
  if(!c||!ID.test(c.id)||cid.has(c.id))return bad('ID dompet tidak valid');
  if(typeof c.name!=='string'||!c.name.trim()||c.name.length>60)return bad('nama dompet tidak valid');
  if(!COL.test(c.color)||!icon(c.icon))return bad('warna/ikon dompet tidak valid');
  cid.add(c.id);o.cats.push({id:c.id,name:c.name,icon:c.icon,color:c.color,initial:isInt(c.initial)?c.initial:0,budget:pos(c.budget)?c.budget:0,archived:!!c.archived});
 }
 const tid=new Set();
 for(const t of d.tx){
  if(!t||!ID.test(t.id)||tid.has(t.id)||!pos(t.amount)||!['in','out'].includes(t.type)||!cid.has(t.catId)||!okDate(t.date))return bad('ada transaksi tidak valid');
  tid.add(t.id);o.tx.push({id:t.id,type:t.type,amount:t.amount,catId:t.catId,date:t.date,note:str(t.note,200),title:str(t.title,120),category:str(t.category,30),method:str(t.method,20),tags:(Array.isArray(t.tags)?t.tags:[]).map(x=>str(x,20)).filter(Boolean).slice(0,10),createdAt:isInt(t.createdAt)?t.createdAt:0});
 }
 const xid=new Set();
 for(const t of d.transfers||[]){
  if(!t||!ID.test(t.id)||xid.has(t.id)||!cid.has(t.from)||!cid.has(t.to)||t.from===t.to||!pos(t.amount)||!okDate(t.date))return bad('ada transfer tidak valid');
  xid.add(t.id);o.transfers.push({id:t.id,from:t.from,to:t.to,amount:t.amount,date:t.date,note:str(t.note,200),createdAt:isInt(t.createdAt)?t.createdAt:0});
 }
 for(const b of d.budgets||[]){
  if(!b||!ID.test(b.id)||!cid.has(b.catId)||!YM.test(b.ym)||!pos(b.amount))return bad('ada anggaran tidak valid');
  o.budgets.push({id:b.id,catId:b.catId,ym:b.ym,amount:b.amount});
 }
 for(const m of d.dreams||[]){
  if(!m||!ID.test(m.id)||!pos(m.target)||!isInt(m.saved)||m.saved<0||!okDate(m.deadline)||!['tinggi','sedang','rendah'].includes(m.priority)||(m.catId&&!cid.has(m.catId)))return bad('ada impian tidak valid');
  o.dreams.push({id:m.id,name:str(m.name,60),target:m.target,saved:m.saved,deadline:m.deadline,priority:m.priority,catId:m.catId||'',note:str(m.note,200)});
 }
 return{ok:true,data:o};
}
/* Saldo semua dompet dalam satu lintasan: awal + masuk - keluar + transfer masuk - transfer keluar */
function balances(d){
 const b={};d.cats.forEach(c=>b[c.id]=c.initial||0);
 d.tx.forEach(t=>{if(t.catId in b)b[t.catId]+=t.type==='in'?t.amount:-t.amount});
 (d.transfers||[]).forEach(t=>{if(t.from in b)b[t.from]-=t.amount;if(t.to in b)b[t.to]+=t.amount});
 return b;
}
const total=d=>{const b=balances(d);return d.cats.filter(c=>!c.archived).reduce((s,c)=>s+b[c.id],0)};
/* Transfer: fungsi murni. Mengembalikan state baru (tidak mengubah state lama) sehingga penulisan ke penyimpanan bisa atomik. */
function applyTransfer(d,r){
 if(!r||!ID.test(r.id||''))return bad('ID transfer tidak valid');
 if((d.transfers||[]).some(t=>t.id===r.id))return{ok:true,state:d,duplicate:true};
 const b=balances(d);
 if(!(r.from in b)||!(r.to in b))return bad('dompet tidak ditemukan');
 if(r.from===r.to)return bad('Dompet sumber dan tujuan harus berbeda');
 if(!pos(r.amount))return bad('Nominal harus bilangan bulat lebih dari 0');
 if(!okDate(r.date))return bad('Tanggal tidak valid');
 if(b[r.from]<r.amount)return bad('Saldo dompet sumber tidak cukup');
 const n=JSON.parse(JSON.stringify(d));
 n.transfers.push({id:r.id,from:r.from,to:r.to,amount:r.amount,date:r.date,note:str(r.note,200),createdAt:r.createdAt||0});
 return{ok:true,state:n};
}
/* Pemasukan/pengeluaran memengaruhi hanya dompet catId. Duplikat dicegah lewat ID. */
function applyTx(d,r){
 if(!r||!ID.test(r.id||''))return bad('ID transaksi tidak valid');
 if(d.tx.some(t=>t.id===r.id))return{ok:true,state:d,duplicate:true};
 const n=JSON.parse(JSON.stringify(d));n.tx.push(r);
 const v=sanitize(n);return v.ok?{ok:true,state:v.data}:v;
}
g.PioDomain={SCHEMA,sanitize,balances,total,applyTransfer,applyTx};
if(typeof module!=='undefined')module.exports=g.PioDomain;
})(typeof globalThis!=='undefined'?globalThis:this);

/* Abstraksi penyimpanan: load() -> state|null, save(state) -> Promise (atomik). Logika keuangan tidak tahu IndexedDB/SQLite. */
(function(g){
function Mem(){let s=null;return{async load(){return s&&JSON.parse(s)},async save(x){s=JSON.stringify(x)}}}
function Idb(name){
 let db;const open=()=>db||(db=new Promise((ok,no)=>{const q=indexedDB.open(name||'piofinance',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)}));
 return{
  async load(){const d=await open();return new Promise((ok,no)=>{const r=d.transaction('kv').objectStore('kv').get('state');r.onsuccess=()=>ok(r.result||null);r.onerror=()=>no(r.error)})},
  /* Satu put dalam satu transaksi IndexedDB = semua-atau-tidak-sama-sekali, aman bila aplikasi tertutup mendadak. */
  async save(x){const d=await open();return new Promise((ok,no)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(JSON.parse(JSON.stringify(x)),'state');t.oncomplete=()=>ok();t.onerror=()=>no(t.error);t.onabort=()=>no(t.error)})}
 };
}
g.PioStorage={Mem,Idb};if(typeof module!=='undefined')module.exports=g.PioStorage;
})(typeof globalThis!=='undefined'?globalThis:this);

</script>
<script>
/* ===== PioFinance v1 — modul: Util, Storage, Domain, Parser, UI ===== */
const $=s=>document.querySelector(s);
const KEY='piofinance:v1';
const COLORS=['#7C3AED','#3B82F6','#EC4899','#10B981','#F59E0B','#EF4444','#06B6D4','#64748B'];
const ICONS=['🍽️','🛒','💰','🛟','🏠','🚗','🎓','💊','🎁','✈️','📱','👕'];
const EMO={Makanan:'🍽️ 🍔 🍕 🍜 🍚 🍞 ☕ 🥗 🍎 🍰 🥤 🍳',Uang:'💰 💵 💳 🏦 💸 🪙 📈 🧾 💎 🤑',Belanja:'🛒 🛍️ 👕 👟 🎁 👜 💄 🧴 📦',Transportasi:'🚗 🏍️ 🚌 🚆 ✈️ ⛽ 🚲 🛵 🚕',Pendidikan:'🎓 📚 ✏️ 🏫 💻 🔬',Kesehatan:'💊 🏥 🩺 🦷 🏋️ 🧘',Rumah:'🏠 🛋️ 💡 🚿 🔧 🧹 🛏️ 🔑',Hiburan:'🎮 🎬 🎵 🎤 ⚽ 🎨 🎉',Kerja:'💼 🖥️ 📱 🏢 📊 🛠️ 📝',Alam:'🌳 🌸 🐶 🐱 🌞 🌊 ⛰️ 🐟',Simbol:'⭐ ❤️ 🎯 🛟 🔒 ✅ 🔥 💜 🚀 🏆'};
const MONTHS=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const NAV=[['dashboard','🏠','Dashboard','Beranda'],['transaksi','🧾','Transaksi','Transaksi'],['dompet','👛','Dompet','Dompet'],['budget','🎯','Budget Planner','Budget'],['impian','⭐','Impian Saya','Impian'],['analisis','📊','Analisis','Analisis'],['pengaturan','⚙️','Pengaturan','Atur']];

/* ---- Util ---- */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>(n<0?'-':'')+'Rp'+Math.abs(n).toLocaleString('id-ID');
const uid=p=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dstr(new Date());
const fdate=s=>new Date(s+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});
const int=v=>parseInt(String(v).replace(/\D/g,''),10)||0;
function toast(m){const t=$('#toast'),er=/^(gagal|nominal|pilih|tanggal|ketik|lengkapi|isi |nama|file backup|penyimpanan|data tersimpan|transfer gagal|dompet sumber|butuh|anggaran kategori|kategori sudah)/i.test(m)||/tidak (valid|terbaca|dapat|tersedia|cukup)|gagal/i.test(m),ok=!er&&/berhasil|tersimpan|disimpan|dihapus|disalin|dipulihkan|digabungkan|diarsipkan|diaktifkan|siap|direset/i.test(m);t.style.background=er?'#BE123C':ok?'#047857':'#4C1D95';t.textContent=(er?'⚠ ':ok?'✓ ':'')+m;t.classList.remove('hidden');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.add('hidden'),2500)}

/* ---- Storage ---- */
function seed(){
  const mk=(id,name,icon,color)=>({id,name,icon,color,initial:0,budget:0,archived:false});
  return{version:1,settings:{},dreams:[],budgets:[],transfers:[],utMig:1,cats:[mk('c_utama','Kantong Utama','👛',COLORS[0]),mk('c_makan','Makan','🍽️',COLORS[0]),mk('c_belanja','Belanja Bulanan','🛒',COLORS[1]),mk('c_tabungan','Tabungan','💰',COLORS[3]),mk('c_darurat','Dana Darurat','🛟',COLORS[2])],tx:[]};
}
function migrate(d){if(!d.utMig){if(!d.cats.some(c=>c.id==='c_utama'||c.name.trim().toLowerCase()==='kantong utama'))d.cats.unshift({id:'c_utama',name:'Kantong Utama',icon:'👛',color:COLORS[0],initial:0,budget:0,archived:false});d.utMig=1}if(!d.bgMig){const ym=today().slice(0,7);d.budgets=d.budgets||[];d.cats.forEach(c=>{if(c.budget>0&&!d.budgets.some(b=>b.catId===c.id&&b.ym===ym))d.budgets.push({id:'b_'+c.id+'_'+ym,catId:c.id,ym,amount:c.budget})});d.bgMig=1}return d}
function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(d&&Array.isArray(d.cats)&&Array.isArray(d.tx))return migrate(Object.assign({dreams:[],budgets:[],transfers:[]},d))}}catch(e){}return seed()}
const Store=PioStorage.Idb();let BLOCK=false,SWW=null,_q=Promise.resolve();
/* save(): state di memori -> satu penulisan atomik ke IndexedDB, diantre berurutan. Dikunci bila data tersimpan gagal divalidasi (agar tidak menimpa data asli). */
function save(){if(BLOCK){toast('Penyimpanan dikunci: data tersimpan tidak terbaca. Pulihkan dari backup.');return false}
 const snap=JSON.parse(JSON.stringify(S));_q=_q.then(()=>Store.save(snap)).catch(()=>toast('Gagal menyimpan data ke perangkat'));return true}
let S=seed();

/* ---- Domain (semua angka dihitung dari transaksi) ---- */
const cat=id=>S.cats.find(c=>c.id===id);
const activeCats=()=>S.cats.filter(c=>!c.archived);

/* ---- Parser Smart Quick Input ---- */
function parseAmt(num,suf){
  num=num.replace(/[.,]+$/,'');let n;
  if(suf&&/^\d+[.,]\d{1,2}$/.test(num))n=parseFloat(num.replace(',','.'));
  else n=parseInt(num.replace(/[.,]/g,''),10);
  return Math.round(n*({k:1e3,rb:1e3,ribu:1e3,jt:1e6,juta:1e6}[suf]||1))||0;
}
function parseQuick(raw){
  let s=raw.trim().toLowerCase().replace(/rp\.?\s*(?=\d)/g,'');
  let type=null;
  if(/^[+]/.test(s))type='in';else if(/^[-−–]/.test(s))type='out';
  s=s.replace(/^[+\-−–]\s*/,'');
  const iw=/\b(pemasukan|gaji|masuk|terima|bonus)\b/,ow=/\b(pengeluaran|keluar|beli|bayar)\b/;
  if(!type){const a=s.search(iw),b=s.search(ow);type=(a>=0&&(b<0||a<b))?'in':'out'}
  let date=today();
  if(/\bkemarin\b/.test(s)){const d=new Date();d.setDate(d.getDate()-1);date=dstr(d)}
  s=s.replace(/\b(kemarin|hari ini)\b/g,' ');
  const m=s.match(/(\d[\d.,]*)\s*(k|rb|ribu|jt|juta)?(?![a-z])/);
  let amount=0,rest=s;
  if(m){amount=parseAmt(m[1],m[2]);rest=s.replace(m[0],' ')}
  rest=rest.replace(new RegExp(iw.source+'|'+ow.source,'g'),' ').replace(/\s+/g,' ').trim();
  const cs=activeCats();let found=cs.filter(c=>rest.includes(c.name.toLowerCase()));
  if(found.length>1)found=found.filter(c=>!found.some(o=>o!==c&&o.name.toLowerCase().includes(c.name.toLowerCase())));
  if(!found.length){const tk=rest.split(' ').filter(t=>t.length>=3);found=cs.filter(c=>tk.some(t=>c.name.toLowerCase().includes(t)))}
  let note=rest;
  if(found.length===1){const nm=found[0].name.toLowerCase(),i=rest.lastIndexOf(nm);if(i>=0)note=(rest.slice(0,i)+' '+rest.slice(i+nm.length)).replace(/\s+/g,' ').trim()}
  return{type,amount,date,catId:found.length===1?found[0].id:'',note,amb:found.length>1,none:!found.length};
}

/* ---- Filter transaksi ---- */
const F={q:'',cat:'',type:'',m:'',y:''};
function updateList(){
  const el=$('#txlist');if(!el)return;const q=F.q.toLowerCase();
  const l=sorted(S.tx.filter(t=>{const c=cat(t.catId);
    return(!F.cat||t.catId===F.cat)&&(!F.type||t.type===F.type)&&(!F.m||t.date.slice(5,7)===F.m)&&(!F.y||t.date.slice(0,4)===F.y)&&
    (!q||((t.note||'')+' '+(t.title||'')+' '+(t.tags||[]).join(' ')).toLowerCase().includes(q)||(c&&c.name.toLowerCase().includes(q))||String(t.amount).includes(q.replace(/\D/g,'')||'§'))}));
  el.innerHTML=`<div class="text-xs mut py-2">${l.length} transaksi · Masuk ${rp(sum(l,'in'))} · Keluar ${rp(sum(l,'out'))}</div>`+(l.map(t=>txRow(t,true)).join('')||'<div class="mut text-sm py-4 text-center">Tidak ada transaksi yang cocok.</div>');
}

/* ---- Render & navigasi ---- */
function render(){
  let p=pages[location.hash.slice(1)]?location.hash.slice(1):'dashboard';if(p==='detail'&&!cat(WD))p='dompet';const np=p==='detail'?'dompet':p;
  $('#side').innerHTML=NAV.map(n=>`<a href="#${n[0]}" class="nav ${n[0]===np?'on':''}"><span>${n[1]}</span>${n[2]}</a>`).join('');
  $('#bottom').innerHTML=NAV.map(n=>`<a href="#${n[0]}" class="bn ${n[0]===np?'on':''}"><div class="text-lg">${n[1]}</div>${n[3]}</a>`).join('');
  $('#view').innerHTML=pages[p]();updateList();
}

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='qi'){e.preventDefault();H.qiGo()}});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
const prefCard=()=>{const t=S.settings||{};return`<div class="card p-4 mb-3"><div class="font-semibold">Profil &amp; Tampilan</div><label>Nama aplikasi</label><input id="pn" class="inp" maxlength="30" value="${esc(t.appName||'')}" placeholder="PioFinance"><label>Nama panggilan</label><input id="pk" class="inp" maxlength="30" value="${esc(t.nick||'')}"><label>Tema</label><div class="seg">${[['system','Ikuti sistem'],['light','Terang'],['dark','Gelap']].map(o=>`<button type="button" data-act="setTheme" data-id="${o[0]}" class="${(t.theme||'system')===o[0]?'on':''}">${o[1]}</button>`).join('')}</div><div class="flex gap-2 mt-3"><button class="btn" data-act="prefSave">Simpan</button>${SWW?'<button class="btn3" data-act="swUpdate">Perbarui aplikasi</button>':''}</div></div>`};
function applyPrefs(){syncMeta();const t=S.settings||{},r=document.documentElement;if(t.theme==='light'||t.theme==='dark')r.dataset.theme=t.theme;else delete r.dataset.theme;const n=t.appName||'PioFinance';document.title=n;const a=$('#appname');if(a)a.textContent=n}
H.prefSave=()=>{S.settings=Object.assign({},S.settings,{appName:$('#pn').value.trim().slice(0,30),nick:$('#pk').value.trim().slice(0,30),theme:S.settings.theme||'system'});save();applyPrefs();toast('Pengaturan tersimpan');render()};
H.swUpdate=()=>{if(SWW)SWW.postMessage('SKIP')};
function regSW(){if(!('serviceWorker'in navigator)||!/^https?:$/.test(location.protocol))return;
 navigator.serviceWorker.register('sw.js').then(reg=>{const offer=w=>{SWW=w;toast('Versi baru tersedia. Buka Pengaturan lalu tekan Perbarui aplikasi.')};
  if(reg.waiting&&navigator.serviceWorker.controller)offer(reg.waiting);
  reg.addEventListener('updatefound',()=>{const n=reg.installing;n.addEventListener('statechange',()=>{if(n.state==='installed'&&navigator.serviceWorker.controller)offer(n)})})}).catch(()=>{});
 let rl=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!rl){rl=true;location.reload()}})}

/* ---- Penyempurnaan: riwayat dompet, grafik dashboard, tema, keyboard ---- */
/* Total per dompet: transfer masuk dihitung sebagai pemasukan dompet itu, transfer keluar sebagai pengeluarannya. Dashboard & anggaran tetap tidak menghitung transfer. */
const TS=id=>{const tr=S.transfers||[];return{i:tr.filter(t=>t.to===id).reduce((s,t)=>s+t.amount,0),o:tr.filter(t=>t.from===id).reduce((s,t)=>s+t.amount,0)}};
function wsum(id,fl){const tr=(S.transfers||[]).filter(t=>(!WF.m||t.date.slice(5,7)===WF.m)&&(!WF.y||t.date.slice(0,4)===WF.y));return{i:sum(fl,'in')+tr.filter(t=>t.to===id).reduce((a,t)=>a+t.amount,0),o:sum(fl,'out')+tr.filter(t=>t.from===id).reduce((a,t)=>a+t.amount,0)}}
function xRow(t,id){const o=t.from===id,x=cat(o?t.to:t.from)||{icon:'❓',name:'(dihapus)'};
 return`<div class="flex items-center gap-3 py-3" style="border-top:1px solid var(--bd)"><div class="ic" style="background:rgba(59,130,246,.14)">⇄</div><div class="min-w-0 flex-1"><div class="font-semibold truncate">Transfer ${o?'ke':'dari'} ${x.icon} ${esc(x.name)}</div><div class="text-xs mut truncate">${fdate(t.date)}${t.note?' · '+esc(t.note):''}</div></div><div class="text-right flex-none"><div class="font-bold t-tr">${o?'-':'+'}${rp(t.amount)}</div></div></div>`}
function walHist(id,fl){const tr=(S.transfers||[]).filter(t=>(t.from===id||t.to===id)&&(!WF.m||t.date.slice(5,7)===WF.m)&&(!WF.y||t.date.slice(0,4)===WF.y));
 const all=fl.map(t=>({k:0,d:t.date,c:t.createdAt||0,t})).concat(tr.map(t=>({k:1,d:t.date,c:t.createdAt||0,t}))).sort((a,b)=>b.d.localeCompare(a.d)||b.c-a.c);
 return all.map(x=>x.k?xRow(x.t,id):txRow(x.t,true)).join('')||'<div class="mut text-sm py-4 text-center">Belum ada transaksi.</div>'}
function miniChart(){if(!S.tx.length)return'';const cur=today().slice(0,7),ms=[];for(let i=5;i>=0;i--)ms.push(ymAdd(cur,-i));
 const md=ms.map(m=>{const l=S.tx.filter(t=>t.date.slice(0,7)===m);return{m,i:sum(l,'in'),o:sum(l,'out')}}),mx=Math.max(1,...md.flatMap(d=>[d.i,d.o]));
 return`<div class="card p-4 mb-4"><div class="flex justify-between items-center mb-1"><h2 class="font-bold">6 bulan terakhir</h2><a href="#analisis" class="text-sm" style="color:var(--pri-tx)">Analisis</a></div><div class="text-xs mut mb-2"><span class="t-in">■</span> Pemasukan &nbsp;<span style="color:#EC4899">■</span> Pengeluaran</div><svg viewBox="0 0 300 120" style="width:100%;color:var(--mut)">${md.map((d,k)=>{const x=k*50+9,h1=d.i/mx*88,h2=d.o/mx*88;return`<rect x="${x}" y="${100-h1}" width="14" height="${h1}" rx="3" fill="#10B981"/><rect x="${x+16}" y="${100-h2}" width="14" height="${h2}" rx="3" fill="#EC4899"/><text x="${k*50+25}" y="115" text-anchor="middle" font-size="9" fill="currentColor">${MONTHS[+d.m.slice(5)-1].slice(0,3)}</text>`}).join('')}</svg></div>`}
H.setType=(id,b)=>{b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));const h=b.parentElement.nextElementSibling;h.value=id;const s=$('#'+h.id.slice(0,-4)+'ctg');if(s)s.innerHTML=ctgOpts(id,'')};
H.setTheme=(id,b)=>{S.settings=Object.assign({},S.settings,{theme:id});save();applyPrefs();b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));toast('Tema tersimpan')};
function syncMeta(){const th=(S.settings||{}).theme,d=th==='dark'||(th!=='light'&&matchMedia('(prefers-color-scheme:dark)').matches),m=document.querySelector('meta[name=theme-color]');if(m)m.content=d?'#12112A':'#7C3AED'}
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',syncMeta);
function fitVV(){const v=window.visualViewport,h=v?v.height:innerHeight;document.documentElement.style.setProperty('--vh',h+'px');$('#modal').style.bottom=v?Math.max(0,innerHeight-v.height-v.offsetTop)+'px':'0'}
fitVV();(window.visualViewport||window).addEventListener('resize',fitVV);
document.addEventListener('focusin',e=>{if(e.target.closest&&e.target.closest('#mbox')&&e.target.matches('input,select,textarea'))setTimeout(()=>e.target.scrollIntoView({block:'center',behavior:'smooth'}),300)});
/* Kategori transaksi (terpisah dari dompet) */
const CTG={out:['Makanan','Transportasi','Belanja','Tagihan','Kesehatan','Pendidikan','Hiburan','Lainnya'],in:['Gaji','Bonus','Hadiah','Usaha','Lainnya']};
const getCtg=t=>((S.settings||{}).ctg&&S.settings.ctg[t])||CTG[t];
function ctgOpts(type,sel){const l=getCtg(type).slice();if(sel&&!l.includes(sel))l.push(sel);return'<option value="">— Tanpa kategori —</option>'+l.map(k=>`<option ${k===sel?'selected':''}>${esc(k)}</option>`).join('')}
H.catReset=()=>confirmBox('Urutan kartu dompet dikembalikan ke urutan awal. Saldo dan transaksi tidak berubah.','catResetOk','x');
H.catResetOk=()=>{const b=['c_utama','c_makan','c_belanja','c_tabungan','c_darurat'],k=c=>b.includes(c.id)?b.indexOf(c.id):99;S.cats.sort((x,y)=>k(x)-k(y)||x.id.localeCompare(y.id));save();closeModal();toast('Urutan dompet dikembalikan');render()};
const utamaId=()=>{const u=S.cats.find(c=>!c.archived&&(c.id==='c_utama'||c.name.trim().toLowerCase()==='kantong utama'));return u?u.id:''};
const ctgCard=()=>`<div class="card p-4 mb-3"><div class="font-semibold">Kategori transaksi</div><p class="mut text-sm my-1">Dipakai di form pemasukan dan pengeluaran. Menghapus kategori tidak mengubah transaksi lama.</p>${[['out','Pengeluaran'],['in','Pemasukan']].map(([t,n])=>`<div class="text-xs mut mt-3 mb-1">${n}</div><div class="flex flex-wrap gap-2">${getCtg(t).map((k,i)=>`<span class="flex items-center" style="border:1px solid var(--bd);border-radius:9999px;padding:.1rem .2rem .1rem .7rem;font-size:.85rem">${esc(k)}<button data-act="ctgDel" data-id="${t}:${i}" class="mut" aria-label="Hapus ${esc(k)}">✕</button></span>`).join('')}</div><div class="flex gap-2 mt-2"><input id="ctn_${t}" class="inp" maxlength="30" placeholder="Kategori ${n.toLowerCase()} baru"><button class="btn2 pri" data-act="ctgAdd" data-id="${t}">Tambah</button></div>`).join('')}<div class="mt-3"><button class="btn2" data-act="ctgReset">Kembalikan kategori awal</button></div></div>`;
const setCtg=(t,l)=>{const c=Object.assign({},(S.settings||{}).ctg);c[t]=l;S.settings=Object.assign({},S.settings,{ctg:c});save();render()};
H.ctgAdd=t=>{const n=($('#ctn_'+t).value||'').trim().slice(0,30),l=getCtg(t).slice();if(!n)return toast('Ketik nama kategori');if(l.some(x=>x.toLowerCase()===n.toLowerCase()))return toast('Kategori sudah ada');l.push(n);setCtg(t,l);toast('Kategori tersimpan')};
H.ctgDel=id=>{const[t,i]=id.split(':'),l=getCtg(t).slice();l.splice(+i,1);setCtg(t,l);toast('Kategori dihapus')};
H.ctgReset=()=>{const c=Object.assign({},(S.settings||{}));delete c.ctg;S.settings=c;save();render();toast('Kategori dikembalikan')};
async function boot(){
 try{let raw=await Store.load();if(!raw){const l=localStorage.getItem(KEY);if(l)raw=JSON.parse(l)}
  if(raw){const r=PioDomain.sanitize(raw);if(r.ok){S=migrate(r.data);if(!(await Store.load()))await Store.save(S)}else{BLOCK=true;console.error('Data tersimpan ditolak:',r.error);toast('Data tersimpan tidak valid ('+r.error+'). Data asli tidak ditimpa.')}}
 }catch(e){BLOCK=true;toast('Penyimpanan perangkat tidak dapat dibuka')}
 applyPrefs();render();if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();regSW()}
boot();
</script>
